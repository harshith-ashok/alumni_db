services:
  # Production-style: nginx serving the built SPA on http://localhost:8080
  web:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-mock}
        VITE_APPS_SCRIPT_URL: ${VITE_APPS_SCRIPT_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports: ["${WEB_PORT:-8080}:8080"]
    restart: unless-stopped

  # Hot reload on http://localhost:${DEV_PORT:-5173}  ->  docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    build: { context: ./frontend, target: dev }
    ports: ["${DEV_PORT:-5173}:5173"]
    environment:
      VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-mock}
      VITE_APPS_SCRIPT_URL: ${VITE_APPS_SCRIPT_URL:-}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
